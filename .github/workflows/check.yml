name: check

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -q requests playwright
          which google-chrome || python -m playwright install --with-deps chromium
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Run
        env:
          TARGET_HOST: ${{ secrets.TARGET_HOST }}
          TARGET_SITE: ${{ secrets.TARGET_SITE }}
          TARGET_ACTIVITIES: ${{ secrets.TARGET_ACTIVITIES }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RULES: "0@18:30,1@18:30,2@18:30,3@18:30,4@18:30,5@10:00,6@10:00"
          LOOP_MINUTES: "0"
        run: python check.py
